name: Build Call Recorder APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create basic project structure if missing
      run: |
        mkdir -p app/src/main/java/com/example/callrecorder
        mkdir -p app/src/main
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.callrecorder">
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
            <application
                android:allowBackup="true"
                android:label="Call Recorder"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/callrecorder/MainActivity.java
        package com.example.callrecorder;
        import android.app.Activity;
        import android.os.Bundle;
        import android.widget.TextView;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                TextView tv = new TextView(this);
                tv.setText("Call Recorder App Ready!");
                setContentView(tv);
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
        }
        android {
            namespace = "com.example.callrecorder"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.example.callrecorder"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
        }
        EOF

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Call Recorder"
        include(":app")
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.2.0" apply false
        }
        EOF
        
        gradle wrapper
        chmod +x gradlew || true

    - name: Build APK with Gradle
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: call-recorder-apk
        path: app/build/outputs/apk/debug/*.apk
